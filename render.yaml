services:
  - type: web
    name: aa-packages-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health.php
    envVars:
      - key: AA_BASE_URL
        value: ""
      - key: AA_API_BASE_URL
        value: ""
      - key: AA_SESSION_TIMEOUT
        value: "28800"
      - key: AA_SESSION_SECURE
        value: "true"
      - key: AA_WHATSAPP_NUMBER
        value: "923108504003"
      - key: AA_DB_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: AA_DB_HOST
        sync: false
      - key: AA_DB_PORT
        sync: false
      - key: AA_DB_NAME
        sync: false
      - key: AA_DB_USER
        sync: false
      - key: AA_DB_PASS
        sync: false
      - key: AA_ALLOWED_ORIGINS
        sync: false
